name: Set up the app
description: Installs the reference Flutter, the locked dependencies, and the generated files a fresh clone needs (CLAUDE.md, "Setup and generated files").

runs:
  using: composite
  steps:
    - name: Read the reference Flutter version
      id: flutter-version
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ steps.flutter-version.outputs.version }}
        cache: true

    # Flutter 3.50 turns on Swift Package Manager and migrates the Xcode projects at build time; on the runner,
    # Xcode 26.3 crashes while resolving the packages (#148). Keep CocoaPods, as with Flutter 3.47, until SPM is
    # checked on the Mac (#136).
    - name: Keep CocoaPods for the Apple builds
      if: runner.os == 'macOS'
      shell: bash
      run: flutter config --no-enable-swift-package-manager

    # window_manager 0.7 (upstream, 2026-11) depends on cnativeapi, whose native build hook runs on every Linux host,
    # even for `dart run` and `flutter test`, and needs the GTK 3, X11 and Xi development packages.
    - name: Install the native build hook dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev

    - name: Get the locked dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile

    - name: Generate files
      shell: bash
      run: |
        dart run open_authenticator:compile_svg
        dart run build_runner build --delete-conflicting-outputs
        dart run slang
        dart run open_authenticator:generate
