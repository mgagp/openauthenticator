name: CI

# Fork-only workflow (#75): checks the code and builds every platform upstream ships (ADR-0004).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Analyze
        run: flutter analyze

      - name: Check the format of the files that differ from upstream
        run: |
          git remote add upstream https://github.com/openauthenticator-app/openauthenticator.git
          git fetch --quiet --depth=1 upstream main
          files=$( (git diff --name-only --diff-filter=d FETCH_HEAD -- '*.dart'; git ls-files --others --exclude-standard -- '*.dart') | sort -u)
          [ -z "$files" ] || dart format --output=none --set-exit-if-changed $files

      - name: Test
        run: flutter test

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --debug
          - target: windows
            os: windows-latest
            command: flutter build windows --debug
          - target: macos
            os: macos-latest
            command: flutter build macos --debug
          - target: ios
            os: macos-latest
            command: flutter build ios --debug --no-codesign
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libpolkit-gobject-1-dev libcurl4-openssl-dev

      - uses: ./.github/actions/setup

      - name: Write google-services.json
        if: matrix.target == 'android'
        run: dart scripts/generate_google_services.dart

      - name: Build
        shell: bash
        run: ${{ matrix.command }}
