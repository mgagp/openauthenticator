name: ezkey_keystore
description: EC P-256 signing keys for EzKey device keys, non-exportable (Android Keystore, StrongBox first; Windows TPM through CNG).
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: org.ezkey.keystore
        pluginClass: EzkeyKeystorePlugin
      windows:
        pluginClass: EzkeyKeystorePluginCApi
