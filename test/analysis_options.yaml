include: ../analysis_options.yaml

analyzer:
  errors:
    # Upstream's lint set (2026-11) flags `async` without `await`. Test fakes keep `async` on purpose: a provider
    # override or an interface fake returns a Future like the real code, so the widget sees the same loading frames.
    unnecessary_async: ignore

linter:
  rules:
    - avoid_dynamic_calls
    - unawaited_futures
    - avoid_print
    - always_declare_return_types
    - avoid_catches_without_on_clauses
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_fields
    - avoid_slow_async_io
    - only_throw_errors
    - use_named_constants
    - no_literal_bool_comparisons
    - prefer_null_aware_method_calls
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - avoid_void_async
